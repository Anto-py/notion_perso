# Configuration des vérifications de ce projet.
#
# C'est le SEUL fichier à adapter quand on reprend verify.sh et review_file.sh
# dans une autre application : les deux scripts sont génériques et ne
# connaissent aucun outil, ils se contentent de lire ce qui suit.
#
# Syntaxe : nom lisible, une barre verticale, commande shell.
# Les lignes vides et celles commençant par # sont ignorées.

[projet]
# Contrôles lancés par la commande de fin de tâche.
# Un contrôle qui échoue n'interrompt pas les suivants.
# Les noms attendus sont « types », « lint » et « tests » ; tout nom absent
# d'ici est signalé comme non configuré, plutôt que passé sous silence.
#
# next typegen d'abord : les types globaux (LayoutProps, PageProps) naissent
# dans .next/, absent d'un clone propre (TS2304 mesuré le 2026-10-30).
types|npx next typegen >/dev/null && npx tsc --noEmit
# ESLint, déjà fourni par create-next-app avec les règles Next.js.
# Projet neuf, rien à geler : le dossier entier.
lint|npx eslint .
# Vitest sort en erreur quand il ne trouve aucun test : garde d'existence,
# qui dit l'absence au lieu de la passer sous silence.
tests|if [ -n "$(find tests src -name '*.test.ts' 2>/dev/null | head -1)" ]; then npx vitest run; else echo "aucun test écrit pour l'instant"; fi

[fichier]
# Contrôles lancés sur un seul fichier.
# {fichier} est remplacé par le chemin donné, {test} par le test associé.
# Une commande contenant {test} est sautée si aucun test n'a été trouvé.
lint|npx eslint {fichier}
test|npx vitest run {test}

[test]
# Où chercher le test d'un fichier source. Le premier motif qui existe gagne.
# {dir} = dossier du fichier, {base} = nom du fichier sans son extension.
tests/{base}.test.ts
{dir}/{base}.test.ts
{dir}/__tests__/{base}.test.ts
